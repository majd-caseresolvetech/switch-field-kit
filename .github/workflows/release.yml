name: Publish download
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Test and build the source package
        run: |
          python3 -m unittest discover -s tests -v
          python3 scripts/package_release.py
      - name: Publish versioned ZIP and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.0 dist/switch-field-kit-0.1.0.zip dist/SHA256SUMS --target "$GITHUB_SHA" --title "Switch Field Kit 0.1.0" --notes-file RELEASE_NOTES.md

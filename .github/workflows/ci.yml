name: Test Field Kit
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      FIELDKIT_DATA: /tmp/fieldkit-ci-data
      FIELDKIT_CONFIG: /tmp/fieldkit-ci-config.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Install PDF utilities
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Unit and release checks
        run: |
          python3 -m unittest discover -s tests -v
          python3 scripts/audit_release.py
      - name: Browser dependency
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Render project-owned test pages
        run: python3 tests/make_fixture.py
      - name: Offline browser checks
        run: |
          python3 -m fieldkit serve > "$RUNNER_TEMP/fieldkit-server.log" 2>&1 &
          python3 scripts/wait_server.py
          npm run test:browser
      - name: Build distributable ZIP
        run: python3 scripts/package_release.py
